spring.application.name=letter-helper
server.port=8080
server.address=0.0.0.0

# ===== HTTPS / SSL =====
server.ssl.enabled=true
server.ssl.certificate=classpath:certs/cert.pem
server.ssl.certificate-private-key=classpath:certs/key.pem


# ===== DATASOURCE =====
spring.datasource.url=jdbc:mysql://letter-helper-mysql-letter-helper.e.aivencloud.com:12678/defaultdb?sslMode=REQUIRED&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=avnadmin
spring.datasource.password=${AIVEN_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== HIKARI CONNECTION POOL =====
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===== MYSQL UTF8MB4 FOR SINHALA / TAMIL / EMOJI ===== newwwww
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.useUnicode=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=info.nanathaksalawa@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== FILE UPLOAD (word images) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB